# Configuración de base de datos H2 en memoria para perfil de desarrollo en pruebas
spring.datasource.url=jdbc:h2:mem:sgp_testdb_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Configuración de Correo SMTP para Pruebas
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=dev@sgp.com
spring.mail.password=dev_pass
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
