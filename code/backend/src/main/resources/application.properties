spring.application.name=sgp-backend
server.port=8080

# Active Profile (dev by default, can be overridden with -Dspring.profiles.active=prod)
spring.profiles.active=dev

# Límite configurable de roles asignables por usuario
sgp.max.roles.per.user=2

# Configuración de Archivos Adjuntos (Etapa 11)
file.upload-dir=./uploads
sgp.attachments.max-size-mb=10
sgp.attachments.allowed-extensions=pdf,png,jpg,jpeg,xls,xlsx,csv,doc,docx,txt

# Límites Multipart de Spring Boot (10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Control de siembra inicial de datos:
# Si es true, sobrescribe contraseñas, roles y purga usuarios que no pertenezcan a la nómina inicial (útil en desarrollo y pruebas).
# En producción debe mantenerse en false para no alterar usuarios existentes, contraseñas ni roles asignados manualmente.
# (Por defecto en application-prod.properties ya se encuentra configurado en false).
sgp.seed.overwrite-users=true
