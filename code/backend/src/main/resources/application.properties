spring.application.name=sgp-backend
server.port=8080

# Active Profile (dev by default, can be overridden with -Dspring.profiles.active=prod)
spring.profiles.active=dev

# Límite configurable de roles asignables por usuario
sgp.max.roles.per.user=2

# Configuración de Archivos Adjuntos (Etapa 11)
file.upload-dir=./uploads
sgp.attachments.max-size-mb=10
sgp.attachments.allowed-extensions=pdf,png,jpg,jpeg,xls,xlsx,csv,doc,docx,txt

# Límites Multipart de Spring Boot (10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Control de siembra inicial de datos:
# Por defecto se mantiene en false para no alterar usuarios existentes, contraseñas ni roles asignados manualmente.
sgp.seed.overwrite-users=false

# URL del Frontend para enlaces en correos electrónicos
sgp.frontend.url=${SGP_FRONTEND_URL:http://localhost:5173}

# Configuración de JWT
jwt.secret=${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
jwt.expiration=36000000
