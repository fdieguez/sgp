# H2 Configuration (Development)
spring.datasource.url=jdbc:h2:file:./data/sgp_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Console Configuration (Access at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logging levels (Policy defined in logback-spring.xml)
logging.level.org.hibernate.orm.jdbc.bind=info
logging.level.root=INFO
logging.level.com.sgp.backend=INFO

# Configuración de Correo SMTP para Desarrollo
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=dev@sgp.com
spring.mail.password=dev_pass
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

