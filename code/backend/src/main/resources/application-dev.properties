# Configuración de MySQL (Desarrollo Local - Nativo)
spring.datasource.url=jdbc:mysql://localhost:3306/sgp_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=sgp_admin
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Configuración de Consola H2 (Deshabilitada para MySQL)
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logging levels (Policy defined in logback-spring.xml)
logging.level.org.hibernate.orm.jdbc.bind=info
logging.level.root=INFO
logging.level.com.sgp.backend=INFO

# Configuración de Correo SMTP para Desarrollo
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=dev@sgp.com
spring.mail.password=dev_pass
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Límite de roles por usuario
sgp.max.roles.per.user=2

